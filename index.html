<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/logo-square.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CheeseCave</title>
    <!-- Apply theme immediately to prevent flash -->
    <script>
      (function () {
        const defaults = {
          default_mode: "system",
          primary_light: "#94621f",
          primary_dark: "#e6b85c",
          background_light: "#f7f4eb",
          background_dark: "#1c211d",
          card_light: "#fffdf7",
          card_dark: "#282e27",
        };
        let theme = defaults;
        let preference;
        try {
          preference = localStorage.getItem("theme");
          const cache = JSON.parse(
            localStorage.getItem("kohakuhub.site-appearance.v1"),
          );
          const saved = cache?.version === 1 && cache.appearance?.theme;
          if (
            saved &&
            ["system", "light", "dark"].includes(saved.default_mode) &&
            Object.keys(defaults)
              .filter((key) => key !== "default_mode")
              .every(
                (key) =>
                  typeof saved[key] === "string" &&
                  /^#[a-f\d]{6}$/i.test(saved[key]),
              )
          )
            theme = saved;
        } catch {
          /* Storage may be unavailable; bundled defaults still render. */
        }
        const mode = ["light", "dark"].includes(preference)
          ? preference
          : theme.default_mode;
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            typeof matchMedia === "function" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        const suffix = dark ? "dark" : "light";
        const html = document.documentElement;
        html.classList.toggle("dark", dark);
        html.dataset.siteTheme = suffix;
        html.style.colorScheme = suffix;
        html.style.setProperty("--site-bg", theme["background_" + suffix]);
        html.style.setProperty("--site-card", theme["card_" + suffix]);
        html.style.setProperty("--site-primary", theme["primary_" + suffix]);
        html.style.backgroundColor = theme["background_" + suffix];
        const luminance = (color) => {
          const values = color.match(/[a-f\d]{2}/gi).map((part) => {
            const channel = parseInt(part, 16) / 255;
            return channel <= 0.04045
              ? channel / 12.92
              : ((channel + 0.055) / 1.055) ** 2.4;
          });
          return values[0] * 0.2126 + values[1] * 0.7152 + values[2] * 0.0722;
        };
        const background = luminance(theme["background_" + suffix]);
        const contrast = (color) => {
          const foreground = luminance(color);
          return (
            (Math.max(background, foreground) + 0.05) /
            (Math.min(background, foreground) + 0.05)
          );
        };
        const soft =
          contrast("#2c332b") >= contrast("#eef0e7") ? "#2c332b" : "#eef0e7";
        const text =
          contrast(soft) >= 4.5
            ? soft
            : contrast("#000000") >= contrast("#ffffff")
              ? "#000000"
              : "#ffffff";
        html.style.setProperty("--site-text", text);
        html.style.color = text;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
