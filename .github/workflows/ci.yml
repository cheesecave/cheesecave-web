name: Web CI

"on":
  pull_request:
    paths:
      - "src/**"
      - "!src/**/*.md"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "vitest.config.js"
      - "uno.config.js"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/*.md"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "vitest.config.js"
      - "uno.config.js"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      category:
        description: Select the verification category
        type: choice
        required: true
        default: all
        options:
          - all
          - regression
          - build
          - docker

permissions:
  contents: read

jobs:
  regression:
    name: Frontend regression and coverage
    if: ${{ (inputs.category || 'all') == 'all' || (inputs.category || 'all') == 'regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the complete regression suite with coverage
        run: pnpm test --maxWorkers=2
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura-coverage.xml
          flags: frontend
          name: web-vitest
          disable_search: true
          fail_ci_if_error: false

  build:
    name: Production build
    if: ${{ (inputs.category || 'all') == 'all' || (inputs.category || 'all') == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production assets
        run: pnpm build
      - name: Check button backgrounds in the built stylesheets
        run: node scripts/check-button-cascade.mjs dist

  docker:
    name: Container build
    if: ${{ (inputs.category || 'all') == 'docker' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the local container image
        run: >-
          docker build
          --build-arg VITE_GIT_COMMIT="$GITHUB_SHA"
          --build-arg VITE_GIT_DIRTY=false
          -t cheesecave-web:ci .
      - name: Verify packaged application and legal notices
        run: |
          docker run --rm --network none --entrypoint sh cheesecave-web:ci -ec '
            test -s /usr/share/nginx/html/index.html
            test -s /usr/share/doc/cheesecave-web/LICENSE
            test -s /usr/share/doc/cheesecave-web/LICENSING.md
            test -s /usr/share/doc/cheesecave-web/NOTICE.md
            if grep -qi "Kohaku Software License" /usr/share/doc/cheesecave-web/NOTICE.md /usr/share/nginx/html/documentation/notices.md; then echo "Kohaku Software License text is still shipped"; exit 1; fi
          '
